version: "3.8"

services:
  pysiem:
    build: .
    container_name: pysiem
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
      - pysiem-data:/app/data/db
    environment:
      - PYSIEM_DB_PATH=/app/data/db/pysiem.db
      - PYSIEM_LOG_PATH=/app/data/logs
      - PYSIEM_RULES_PATH=/app/rules
      - PYSIEM_LOG_LEVEL=INFO
    entrypoint: ["python", "main.py"]
    command: ["--help"]

volumes:
  pysiem-data:
